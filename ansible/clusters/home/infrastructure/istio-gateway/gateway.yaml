apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: istio-ingress
  annotations:
    # MetalLB reads this annotation to pin the LoadBalancer IP — Istio
    # propagates Gateway annotations onto the Service it auto-provisions.
    metallb.io/loadBalancerIPs: "192.168.0.210"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-naadroid-tls 
      allowedRoutes:
        namespaces:
          from: All