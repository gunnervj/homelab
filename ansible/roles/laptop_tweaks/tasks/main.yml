---
- name: Ignore lid switch events entirely
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: HandleLidSwitch,             value: ignore }
    - { key: HandleLidSwitchDocked,       value: ignore }
    - { key: HandleLidSwitchExternalPower, value: ignore }
  notify: restart logind

- name: Mask all sleep/suspend/hibernate targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Keep battery charge in a longevity-friendly band
  ansible.builtin.copy:
    dest: /etc/systemd/system/battery-threshold.service
    mode: "0644"
    content: |
      [Unit]
      Description=Cap battery charge to preserve cell health
      After=multi-user.target
      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'echo 80 > /sys/class/power_supply/BAT0/charge_control_end_threshold || true'
      [Install]
      WantedBy=multi-user.target

- name: Enable the battery threshold unit
  ansible.builtin.systemd:
    name: battery-threshold.service
    enabled: true
    state: started
    daemon_reload: true