prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 45GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources: { requests: { storage: 50Gi } }
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits:   { memory: 4Gi }
    # Discover ServiceMonitors in all namespaces, not just this Helm release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    certManager:
      enabled: true
      issuerRef:
        name: webhook-selfsigned
        kind: ClusterIssuer

grafana:
  enabled: true
  fullnameOverride: grafana   # pins the Service name so the HTTPRoute's
                               # backendRef below is correct regardless of
                               # what you named this Application — without
                               # this the chart defaults to
                               # <release-name>-grafana (e.g.
                               # kube-prometheus-stack-grafana), which is
                               # NOT what the HTTPRoute points at
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  ingress:
    enabled: false      # routed via HTTPRoute below, same pattern as the rest of Phase 4
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources: { requests: { storage: 5Gi } }

# k3s runs the control plane inside a single process, so these separate
# scrape targets don't exist and will alert as permanently down.
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeProxy:             { enabled: false }
kubeEtcd:              { enabled: false }