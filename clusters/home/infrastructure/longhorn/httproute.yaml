apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: istio-ingress
  hostnames:
    - "longhorn.naadroid.dev"
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80