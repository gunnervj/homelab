langfuse:
  podSecurityContext:
    runAsUser: 1001
    fsGroup: 1001
  securityContext:
    runAsUser: 1001
    runAsNonRoot: true

  nextauth:
    url: "https://langfuse.naadroid.dev"
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: NEXTAUTH_SECRET
  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: SALT
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: ENCRYPTION_KEY

postgresql:
  deploy: false
  host: "postgres-rw.shared-data.svc.cluster.local"
  port: 5432
  auth:
    username: "admin"
    database: "langfuse"
    existingSecret: "langfuse-secrets"
    secretKeys:
      userPasswordKey: "DB_PASSWORD"

clickhouse:
  deploy: false
  host: "clickhouse-clickhouse-headless.shared-data.svc.cluster.local"
  cluster:
    enabled: false
  auth:
    username: "default"
    existingSecret: "langfuse-secrets"
    existingSecretKey: "CLICKHOUSE_PASSWORD"

redis:
  deploy: false
  host: "redis.shared-data.svc.cluster.local"
  port: 6379

s3:
  deploy: false
  bucket: "langfuse"
  region: "garage"
  endpoint: "http://garage.garage.svc.cluster.local:3900"
  forcePathStyle: true
  accessKeyId:
    secretKeyRef:
      name: langfuse-secrets
      key: S3_ACCESS_KEY_ID
  secretAccessKey:
    secretKeyRef:
      name: langfuse-secrets
      key: S3_SECRET_ACCESS_KEY
