apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.3
      helm:
        valueFiles:
          - $values/clusters/home/infrastructure/longhorn/values.yaml
    - repoURL: https://github.com/gunnervj/homelab.git
      targetRevision: main
      path: clusters/home/infrastructure/longhorn
      directory:
        include: '{httproute.yaml,storageclasses.yaml}'
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]