apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: affine
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://github.com/gunnervj/homelab.git
    targetRevision: main
    path: clusters/home/apps/affine
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: affine
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
