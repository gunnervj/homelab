apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 11.4.0
      helm:
        valueFiles:
          - $values/clusters/home/infrastructure/velero/values.yaml
    - repoURL: https://github.com/gunnervj/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/gunnervj/homelab.git
      targetRevision: main
      path: clusters/home/infrastructure/velero
      directory:
        include: 'credentials-sealed.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]