apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after infrastructure, before langfuse depends on it
spec:
  project: default
  source:
    repoURL: https://github.com/gunnervj/homelab.git
    targetRevision: main
    path: clusters/home/apps/postgres
    helm:
      valueFiles:
        - values-overrides.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-data
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]