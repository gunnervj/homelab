apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/deuxfleurs-org/garage.git  
      targetRevision: v2.1.0   
      path: script/helm/garage
      helm:
        valueFiles:
          - $values/clusters/home/infrastructure/garage/values.yaml
    - repoURL: https://github.com/gunnervj/homelab.git  
      targetRevision: main
      ref: values
    - repoURL: https://github.com/gunnervj/homelab.git  
      targetRevision: main
      path: clusters/home/infrastructure/garage
      directory:
        include: '{garage-secrets-sealed.yaml,httproute.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]